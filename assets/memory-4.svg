<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 700" width="100%" height="100%">
  <defs>
    <linearGradient id="selfieBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e8f0fe"/>
      <stop offset="50%" stop-color="#f3e8ff"/>
      <stop offset="100%" stop-color="#fce7f3"/>
    </linearGradient>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feOffset dx="0" dy="6" result="offset"/>
      <feComposite in="SourceGraphic" in2="offset" operator="over"/>
    </filter>
  </defs>

  <rect width="600" height="700" fill="url(#selfieBg)"/>

  <!-- Camera / Frame aesthetics -->
  <circle cx="100" cy="120" r="60" fill="#fff" opacity="0.6"/>
  <circle cx="510" cy="140" r="90" fill="#fdf2f8" opacity="0.8"/>
  <circle cx="90" cy="530" r="80" fill="#fff" opacity="0.7"/>

  <!-- Instant Camera in center -->
  <g transform="translate(160, 230)">
    <!-- Camera Shadow -->
    <rect x="20" y="240" width="240" height="20" rx="10" fill="#cbd5e1" opacity="0.5"/>

    <!-- Camera Body -->
    <rect x="10" y="20" width="260" height="220" rx="36" fill="#ffffff" stroke="#e2e8f0" stroke-width="6" filter="url(#softShadow)"/>
    
    <!-- Pastel Rainbow stripe on camera -->
    <g transform="translate(25, 45)">
      <rect x="0" y="0" width="230" height="6" fill="#f87171"/>
      <rect x="0" y="6" width="230" height="6" fill="#fbbf24"/>
      <rect x="0" y="12" width="230" height="6" fill="#34d399"/>
      <rect x="0" y="18" width="230" height="6" fill="#60a5fa"/>
      <rect x="0" y="24" width="230" height="6" fill="#a78bfa"/>
    </g>

    <!-- Big Lens in center -->
    <circle cx="140" cy="140" r="65" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="5"/>
    <circle cx="140" cy="140" r="48" fill="#334155"/>
    <circle cx="140" cy="140" r="36" fill="#1e293b"/>
    <circle cx="125" cy="125" r="12" fill="#64748b" opacity="0.6"/>
    <circle cx="120" cy="120" r="5" fill="#ffffff" opacity="0.9"/>
    
    <!-- Heart Reflection in Lens -->
    <path d="M140 135 C136 130 128 132 130 138 C132 143 140 148 140 150 C140 148 148 143 150 138 C152 132 144 130 140 135 Z" fill="#f43f5e" opacity="0.8"/>

    <!-- Viewfinder -->
    <rect x="35" y="45" width="36" height="28" rx="8" fill="#334155"/>
    <rect x="41" y="51" width="24" height="16" rx="4" fill="#94a3b8"/>

    <!-- Shutter Button -->
    <ellipse cx="230" cy="18" rx="14" ry="6" fill="#fb7185"/>

    <!-- Flash module -->
    <rect x="205" y="48" width="40" height="24" rx="6" fill="#fef08a" stroke="#facc15" stroke-width="2"/>
    <circle cx="225" cy="60" r="6" fill="#ffffff"/>
  </g>

  <!-- Emerging Photo sticking out from top of camera -->
  <g transform="translate(210, 80)">
    <rect x="0" y="0" width="180" height="110" rx="6" fill="#ffffff" stroke="#f1f5f9" stroke-width="3" filter="url(#softShadow)"/>
    <rect x="12" y="10" width="156" height="80" rx="3" fill="#ffe4e6"/>
    <!-- Two cute smiley faces inside photo -->
    <circle cx="65" cy="50" r="20" fill="#ffd166"/>
    <circle cx="60" cy="46" r="2.5" fill="#333"/>
    <circle cx="70" cy="46" r="2.5" fill="#333"/>
    <path d="M62 54 Q65 58 68 54" stroke="#333" stroke-width="2" fill="none" stroke-linecap="round"/>
    <ellipse cx="56" cy="52" rx="3" ry="2" fill="#f43f5e" opacity="0.6"/>
    <ellipse cx="74" cy="52" rx="3" ry="2" fill="#f43f5e" opacity="0.6"/>

    <circle cx="115" cy="50" r="20" fill="#a78bfa"/>
    <circle cx="110" cy="46" r="2.5" fill="#333"/>
    <circle cx="120" cy="46" r="2.5" fill="#333"/>
    <path d="M112 54 Q115 58 118 54" stroke="#333" stroke-width="2" fill="none" stroke-linecap="round"/>
    <ellipse cx="106" cy="52" rx="3" ry="2" fill="#f43f5e" opacity="0.6"/>
    <ellipse cx="124" cy="52" rx="3" ry="2" fill="#f43f5e" opacity="0.6"/>

    <text x="90" y="24" font-size="14" text-anchor="middle">✌️ ✨</text>
  </g>

  <!-- Sparkles -->
  <text x="120" y="200" font-size="30">✨</text>
  <text x="460" y="260" font-size="28">📸</text>
  <text x="430" y="470" font-size="32">🌸</text>
  <text x="100" y="480" font-size="32">💖</text>

  <!-- Banner / Text -->
  <g transform="translate(300, 630)">
    <rect x="-140" y="-24" width="280" height="48" rx="24" fill="#ffffff" stroke="#c084fc" stroke-width="2"/>
    <text x="0" y="7" font-family="'Nunito', sans-serif" font-weight="900" font-size="20" fill="#7e22ce" text-anchor="middle">Lưu giữ mọi nụ cười 📸</text>
  </g>
</svg>
