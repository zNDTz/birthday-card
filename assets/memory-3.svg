<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 700" width="100%" height="100%">
  <defs>
    <linearGradient id="partyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff0f5"/>
      <stop offset="50%" stop-color="#fdf0ed"/>
      <stop offset="100%" stop-color="#f0f3ff"/>
    </linearGradient>
    <linearGradient id="goldRibbon" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffe066"/>
      <stop offset="100%" stop-color="#f77f00"/>
    </linearGradient>
    <filter id="boxGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <rect width="600" height="700" fill="url(#partyGrad)"/>

  <!-- Party Bunting / Flags -->
  <g stroke="#ffccd5" stroke-width="2" fill="none">
    <path d="M-20 60 Q 150 120 300 80 Q 450 120 620 60"/>
  </g>
  <polygon points="60,82 95,89 77,135" fill="#ff758f"/>
  <polygon points="140,100 175,103 157,150" fill="#ffd166"/>
  <polygon points="220,95 255,90 238,142" fill="#a2d2ff"/>
  <polygon points="305,80 340,84 322,132" fill="#b388eb"/>
  <polygon points="385,93 420,100 402,148" fill="#ff8fab"/>
  <polygon points="465,105 500,100 482,150" fill="#90be6d"/>

  <!-- Sparkles & Confetti bits in background -->
  <circle cx="90" cy="220" r="8" fill="#ffd166" opacity="0.8"/>
  <rect x="490" y="210" width="14" height="8" rx="2" fill="#ff758f" transform="rotate(25 490 210)"/>
  <rect x="120" y="440" width="12" height="6" rx="2" fill="#a2d2ff" transform="rotate(-35 120 440)"/>
  <circle cx="510" cy="460" r="6" fill="#b388eb"/>
  <path d="M140 320 Q140 335 125 335 Q140 335 140 350 Q140 335 155 335 Q140 335 140 320 Z" fill="#ffd166"/>
  <path d="M470 330 Q470 345 455 345 Q470 345 470 360 Q470 345 485 345 Q470 345 470 330 Z" fill="#ff758f"/>

  <!-- Giant Gift Box in Center -->
  <g transform="translate(190, 270)">
    <!-- Box Shadow -->
    <ellipse cx="110" cy="255" rx="120" ry="22" fill="#e8bbcf" opacity="0.5"/>
    
    <!-- Box Body -->
    <rect x="20" y="80" width="180" height="160" rx="16" fill="#ff8fab" stroke="#ff4d6d" stroke-width="4"/>
    <rect x="92" y="80" width="36" height="160" fill="url(#goldRibbon)"/>

    <!-- Box Lid -->
    <rect x="10" y="50" width="200" height="40" rx="10" fill="#ffb3c6" stroke="#ff4d6d" stroke-width="4"/>
    <rect x="92" y="50" width="36" height="40" fill="url(#goldRibbon)"/>

    <!-- Big Ribbon Bow -->
    <g transform="translate(110, 48)">
      <!-- Left loop -->
      <path d="M0 0 C -40 -50, -70 -20, -15 0 Z" fill="url(#goldRibbon)" stroke="#e85d04" stroke-width="2.5"/>
      <!-- Right loop -->
      <path d="M0 0 C 40 -50, 70 -20, 15 0 Z" fill="url(#goldRibbon)" stroke="#e85d04" stroke-width="2.5"/>
      <!-- Ribbon Center knot -->
      <circle cx="0" cy="0" r="14" fill="#ffd166" stroke="#e85d04" stroke-width="2.5"/>
      <!-- Ribbon tails -->
      <path d="M-8 8 L-30 45 L-12 40 L-4 20" fill="url(#goldRibbon)"/>
      <path d="M8 8 L30 45 L12 40 L4 20" fill="url(#goldRibbon)"/>
    </g>

    <!-- Cute Heart Tag -->
    <g transform="translate(150, 120) rotate(15)">
      <line x1="0" y1="-15" x2="0" y2="0" stroke="#f77f00" stroke-width="2"/>
      <path d="M0 0 C -12 -16, -30 -5, -20 15 C -10 32, 0 42, 0 48 C 0 42, 10 32, 20 15 C 30 -5, 12 -16, 0 0 Z" fill="#ffffff" stroke="#ff4d6d" stroke-width="2"/>
      <text x="0" y="24" font-family="'Nunito', sans-serif" font-weight="900" font-size="11" fill="#ff4d6d" text-anchor="middle">FOR U</text>
    </g>
  </g>

  <!-- Floating Birthday Sparkles popping from box -->
  <g transform="translate(300, 200)">
    <text x="-60" y="-30" font-size="34">✨</text>
    <text x="40" y="-45" font-size="32">💖</text>
    <text x="-15" y="-70" font-size="36">🎉</text>
  </g>

  <!-- Banner / Text -->
  <g transform="translate(300, 630)">
    <rect x="-150" y="-24" width="300" height="48" rx="24" fill="#ffffff" stroke="#ffccd5" stroke-width="2"/>
    <text x="0" y="7" font-family="'Nunito', sans-serif" font-weight="900" font-size="20" fill="#d94f88" text-anchor="middle">Món quà từ trái tim 🎁</text>
  </g>
</svg>
